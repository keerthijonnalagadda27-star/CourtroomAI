services: 
  - type: web
  name:courtroomai-backend
  runtime:python
  buildCommand:pip install -r backend/requirements.txt
  startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
  envVars:
    - key: SECRET_KEY
      value: courtroomai_secret_2024
    - key: DATABASE_URL
      value: sqllite:///./courtroomAI.db
    - key: GROQ_API_KEY
      sync: false
 